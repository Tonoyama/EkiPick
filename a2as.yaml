manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: tonoyama/ekipick
    source: https://github.com/tonoyama/ekipick
    branch: main
    commit: "252e28d2"
    scope: [app/routers/chat.py, app/routers/commute.py, app/services/agents/advisor_agent.py, app/services/agents/custom_agent.py,
      app/services/agents/estate_agent.py, app/services/agents/followup_agent.py, app/services/agents/hazard_agent.py, app/services/agents/report_agent.py,
      app/services/agents/station_agent.py, app/services/agents/suggestion_agent.py, app/services/agents/summry_agent.py,
      app/services/navitime.py, app/services/tools/check_hazard_info.py, app/services/tools/gemini_search.py, app/services/tools/get_latlon_from_address.py,
      app/services/tools/get_nearby_buildings.py, app/services/tools/map_api.py, app/services/tools/reachable_station.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:58:08Z'
    url: https://a2as.org/certified/agents/tonoyama/ekipick
  signatures:
    digest: sha256:kqAXr8ZEgF_hGXsS9_iDV8qHjg6S__E8AQ037Xtonjg
    key: ed25519:Gj34NGYnxoSZqbfam1RqzMMw6B4yYUbx7FaXccMmcqM
    sig: ed25519:z6GRjKkSOiFqmWS6AchsHmy9fjRWflpaambhewP5rpl1gJA1JH8Z7HXOP6L5ik-4izuvX5Aha5K_ZYGdU8J8DA

agents:
  advisor_agent:
    type: instance
    models: [gemini-2.0-flash-001]
    params:
      name: advisor_agent
      description: アドバイザーエージェント
      include_contents: default
      instruction: ['[description]', '[workflow]']
      function: build_advisor_agent
      instance: agent
  agent.0:
    type: instance
    models: [gemini-2.0-flash-001]
    params:
      name: build_followup_agent
      description: 追加質問フォローアップエージェント
      include_contents: default
      instruction: ['[description]', '[ワークフロー]']
      function: build_followup_agent
      instance: agent
  agent.1:
    type: instance
    models: [gemini-2.0-flash-001]
    tools: [reachable_station, gemini_search]
    params:
      name: reachable_station_agent
      description: 住む駅推薦エージェント
      include_contents: default
      instruction: ['[description]', '[ワークフロー]', 少々お待ちください。, '[Tasks]', '* tool reachable_station が失敗した場合、あなたは tool gemini_search
          を必ず呼び出して回答します']
      function: build_suggest_agent
      instance: agent
  agent.2:
    type: instance
    models: [gemini-2.0-flash-001]
    tools: [get_station_coordinates]
    params:
      name: estate_suggestion
      description: 駅表示エージェント
      include_contents: default
      instruction: ['[description]', '[Tasks]']
      function: build_station_agent
      instance: agent
  agent.3:
    type: instance
    models: [gemini-2.5-flash]
    tools: [get_station_coordinates]
    params:
      name: estate_suggestion
      description: 駅表示エージェント
      include_contents: default
      instruction: ['[案内テンプレート]', '[Tasks]']
      function: build_multiple_pin_station_agent
      instance: agent
  agent.4:
    type: instance
    models: [gemini-2.0-flash-001]
    tools: [get_station_coordinates]
    params:
      name: report_agent
      description: 駅周辺情報調査エージェント
      include_contents: default
      instruction: ['[description]', '貴方がやる唯一のことは、与えられた tool gemini_searchを用いて、入力にある{number}番目の駅についてを詳細情報を解説することです。', 'また、{number}番目の駅が入力に存在しない場合には、「出力無」とだけ記載してください',
        '[ワークフロー]', '[Tasks]']
      function: build_report_agent
      instance: agent
  agent.5:
    type: instance
    models: [gemini-2.0-flash-001]
    tools: [get_latlon_from_address, get_nearby_buildings, gemini_search, hazard_agent]
    params:
      name: estate_suggestion
      description: 不動産提案コンシェルジュエージェント
      include_contents: default
      instruction: ['[description]', '[ワークフロー]', '[Tasks]']
      function: build_estate_agent
      instance: agent
      sub_agents: [advisor_agent, summary_agent]
  agent.build_hazard_agent:
    type: factory
    models: [gemini-2.0-flash-001]
    tools: [check_hazard_info]
    params:
      name: hazard_agent
      description: 災害情報確認エージェント
      include_contents: default
      instruction: ['[description]', '[ワークフロー]', "...", '[Tasks]']
      function: build_hazard_agent
      instance: agent
  summary_agent:
    type: instance
    models: [gemini-2.0-flash-001]
    params:
      name: summary_agent
      description: サマリーエージェント
      include_contents: default
      instruction: ['[description]', '[workflow]', 会話レポートまとめ, 1. 今回の依頼内容]
      function: build_summary_agent
      instance: agent

models:
  gemini-2.0-flash-001:
    type: literal
    agents: [agent.0, advisor_agent, agent.1, agent.2, agent.4, summary_agent, agent.build_hazard_agent, agent.5]
  gemini-2.5-flash:
    type: literal
    agents: [agent.3]

tools:
  check_hazard_info:
    type: function
    agents: [agent.build_hazard_agent]
  gemini_search:
    type: function
    agents: [agent.1, agent.5]
    params:
      description: |-
        クエリ情報から検索した結果を返却する関数

        Args:
            query: str
                「新宿駅周辺はどのような街ですか？」
                「赤坂見附は一般人が住むのに適している街でしょうか？」
        Returns:
            str: 回答結果
  get_latlon_from_address:
    type: function
    agents: [agent.5]
    params:
      description: |-
        住所から緯度・経度を取得してピンを打つためのツール
        国土地理院のAPIを使用

        Args:
            address: 住所文字列・駅名などを入力する

        Returns:
            dict
                lat: value
                lon: value
            if raised Exception, return empty dict
  get_nearby_buildings:
    type: function
    agents: [agent.5]
    params:
      description: |-
        Google Places APIを使用して周辺建物情報を取得

        Args:
            lat: 緯度
            lon: 経度
            radius: 検索半径（メートル、デフォルト: 1000m）
            place_type: 建物タイプ (restaurant, hospital, school, bank, etc.)
            None の場合は指定しない

        Returns:
            JSON文字列形式の周辺建物情報
  get_station_coordinates:
    type: function
    agents: [agent.2, agent.3, agent.4]
  hazard_agent:
    type: agent
    agents: [agent.5]
    params:
      wrapper: AgentTool
  reachable_station:
    type: function
    agents: [agent.1]

teams:
  agent.5:
    type: hierarchy
    agents: [agent.5, advisor_agent, summary_agent]

