    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [current_dir, "..", "..", "..", data, lineinfo.csv]

networks:
  maps.googleapis.com:
    type: api
    actions: [GET]
    urls: [/maps/api/place/nearbysearch/json, /maps/api/geocode/json]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [get_nearby_buildings, get_station_coordinates, get_station_position]
  url:
    type: api
    actions: [GET]
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://{RAPID_HOST}{path}
      caller: [_http_get]
      dynamic: "True"
      variable: url
